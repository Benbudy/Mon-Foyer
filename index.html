<style>
:root{--bg:#f6f3ee;--card:#fff;--tx:#2a2622;--mu:#7b736a;--ac:#c4552d;--ac2:#fbe7df;--bd:#e6dfd5;--ok:#4f8a5b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a18;--card:#282522;--tx:#f1ece5;--mu:#a39a8f;--ac:#ef8a62;--ac2:#3b2a22;--bd:#3a3631;--ok:#7bbf88;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1a18;--card:#282522;--tx:#f1ece5;--mu:#a39a8f;--ac:#ef8a62;--ac2:#3b2a22;--bd:#3a3631;--ok:#7bbf88;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#main{flex:1;overflow-y:auto;padding:20px 16px 24px;max-width:720px;width:100%;margin:0 auto}
h1{font:700 28px/1.1 Georgia,"Times New Roman",serif;margin:4px 0 2px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:24px 0 8px}
.sub{color:var(--mu);margin:0 0 18px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 12px;text-align:left;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:104px}
.tile:active{transform:scale(.97)}
.tile .i{font-size:28px}.tile b{font-size:15px}.tile small{color:var(--mu);font-size:12px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top h1{flex:1;font-size:24px;margin:0}
.btn{border:0;border-radius:12px;padding:10px 14px;font:600 15px inherit;background:var(--ac);color:#fff;cursor:pointer}
.btn.g{background:var(--ac2);color:var(--ac)}.btn.d{background:transparent;color:#c0392b;border:1px solid var(--bd)}
.back{background:none;border:0;font-size:24px;color:var(--ac);cursor:pointer;padding:0 6px 0 0}
input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
textarea{min-height:110px;font:12px/1.3 ui-monospace,monospace}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-top:8px;display:flex;gap:12px;align-items:center;cursor:pointer}
.item .t{flex:1;min-width:0}.item b{display:block;overflow-wrap:anywhere}.item span{color:var(--mu);font-size:13px;overflow-wrap:anywhere}
.item.done b{text-decoration:line-through;color:var(--mu)}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--ac);background:none;flex:none;cursor:pointer;color:#fff;font-size:15px;padding:0}
.done .ck{background:var(--ok);border-color:var(--ok)}
.empty{text-align:center;color:var(--mu);padding:36px 10px}
.empty .i{font-size:44px}
nav{display:flex;border-top:1px solid var(--bd);background:var(--card)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:9px 0 8px;font:600 12px inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:22px}nav button.on{color:var(--ac)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.row{display:flex;gap:8px;margin-top:16px}.row .btn{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--ac2);color:var(--ac);border-radius:20px;padding:6px 8px 6px 12px;margin:0 6px 6px 0;font-weight:600}
.chip button{border:0;background:none;color:inherit;font-size:16px;cursor:pointer}
:root{--ac:#1c3a74;--ac2:#e4ebf8;--bg:#f3f5f9;--card:#fff;--glass:rgba(255,255,255,.74);--bd:#dce2ee;--mu:#64718a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1018;--card:#161b27;--glass:rgba(22,27,39,.72);--ac:#7fa6f5;--ac2:#18243f;--bd:#252d3f;--tx:#eef2f8;--mu:#93a0b8}}
:root[data-theme="dark"]{--bg:#0c1018;--card:#161b27;--glass:rgba(22,27,39,.72);--ac:#7fa6f5;--ac2:#18243f;--bd:#252d3f;--tx:#eef2f8;--mu:#93a0b8}
body{background:radial-gradient(700px 420px at 0% -5%,hsl(215 75% 86%/.5),transparent 65%),radial-gradient(600px 420px at 100% 5%,hsl(35 95% 86%/.45),transparent 65%),var(--bg);background-attachment:fixed;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:radial-gradient(700px 420px at 0% -5%,hsl(220 55% 24%/.55),transparent 65%),radial-gradient(600px 420px at 100% 5%,hsl(30 50% 22%/.35),transparent 65%),var(--bg)}}
:root[data-theme="dark"] body{background:radial-gradient(700px 420px at 0% -5%,hsl(220 55% 24%/.55),transparent 65%),radial-gradient(600px 420px at 100% 5%,hsl(30 50% 22%/.35),transparent 65%),var(--bg)}
h1{font:800 36px/1.05 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.035em;background:linear-gradient(120deg,var(--tx) 30%,var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.top h1{font-size:26px}
.eye{font-size:13px;font-weight:700;color:var(--ac);text-transform:capitalize;letter-spacing:.02em}
